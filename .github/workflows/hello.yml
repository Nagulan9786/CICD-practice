   name: Hello CI

   on:
     push:
       branches: [main]
     pull_request:

   jobs:
     hello:
       runs-on: ubuntu-latest
       steps:
         - uses: actions/checkout@v4
         - name: Say hello
           run: echo "Hello from $GITHUB_REPOSITORY at commit $GITHUB_SHA"
         - name: List files
           run: ls -la